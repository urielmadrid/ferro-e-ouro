<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="fo-title">
  <title id="fo-title">Ferro &amp; Ouro</title>
  <defs>
    <linearGradient id="fo-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F2F4"/>
      <stop offset=".45" stop-color="#9DA2AB"/>
      <stop offset="1" stop-color="#3A3D43"/>
    </linearGradient>
    <linearGradient id="fo-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0DCAA"/>
      <stop offset=".5" stop-color="#B08D57"/>
      <stop offset="1" stop-color="#6F5530"/>
    </linearGradient>
  </defs>

  <!-- anel externo: metade ferro (esquerda), metade ouro (direita) -->
  <path d="M93.86 187.79 A88 88 0 0 1 93.86 12.21" fill="none" stroke="url(#fo-iron)" stroke-width="4"/>
  <path d="M106.14 12.21 A88 88 0 0 1 106.14 187.79" fill="none" stroke="url(#fo-gold)" stroke-width="4"/>
  <!-- anel interno fino -->
  <circle cx="100" cy="100" r="79" fill="none" stroke="#8A8F98" stroke-opacity=".45" stroke-width="1"/>

  <!-- F: haste = navalha de ferro; braços = lâminas de ouro embutidas -->
  <polygon points="70,50 87,50 87,150 70,138" fill="url(#fo-iron)"/>
  <line x1="74.5" y1="56" x2="74.5" y2="128" stroke="#FFFFFF" stroke-opacity=".35" stroke-width=".8"/>
  <polygon points="91,50 130,50 122,63 91,63" fill="url(#fo-gold)"/>
  <polygon points="91,84 122,84 114,97 91,97" fill="url(#fo-gold)"/>
  <!-- pivô da navalha -->
  <circle cx="78.5" cy="124" r="3" fill="#0A0A0B" stroke="#B08D57" stroke-width="1.2"/>
</svg>
