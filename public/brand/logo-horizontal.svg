<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 120" role="img" aria-labelledby="fo-h-title">
  <title id="fo-h-title">Ferro &amp; Ouro</title>
  <defs>
    <linearGradient id="fo-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F2F4"/>
      <stop offset=".45" stop-color="#9DA2AB"/>
      <stop offset="1" stop-color="#3A3D43"/>
    </linearGradient>
    <linearGradient id="fo-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0DCAA"/>
      <stop offset=".5" stop-color="#B08D57"/>
      <stop offset="1" stop-color="#6F5530"/>
    </linearGradient>
    <clipPath id="fo-clip-r"><rect x="-5" y="-5" width="50" height="61"/></clipPath>
  </defs>

